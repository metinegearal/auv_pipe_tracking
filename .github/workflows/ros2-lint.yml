name: ROS 2 Linter Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint_code:
    name: Ament Linters
    runs-on: ubuntu-24.04
    
    # Run inside the official ROS 2  Docker container
    container:
      image: ros:-ros-base
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIX 1: Use the official ROS 2  package names
      - name: Install Linters
        run: |
          apt-get update
          apt-get install -y ros--ament-flake8 ros--ament-clang-format

      # FIX 2: Source the ROS 2 environment before running the commands
      - name: Run ament_flake8 (Python)
        run: |
          source /opt/ros//setup.bash
          ament_flake8 src/
        shell: bash

      - name: Run ament_clang_format (C++)
        run: |
          source /opt/ros//setup.bash
          ament_clang_format src/
        shell: bash